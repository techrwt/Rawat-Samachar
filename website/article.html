<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">रावत समाचार - विस्तार से पढ़ें</title>
  <meta name="description" id="meta-desc" content="रावत समाचार पर ताज़ा खबरें पढ़ें।">
  <style>
    :root {
      --primary: #c92a2a;
      --bg-dark: #1a1a1a;
      --text-main: #212529;
      --border: #dee2e6;
      --light-bg: #f8f9fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--light-bg); color: var(--text-main); line-height: 1.8; }
    
    header { background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
    .top-bar { background: var(--bg-dark); color: #fff; padding: 8px 20px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .brand-container { text-align: center; padding: 15px 0; background: var(--primary); color: #fff; text-decoration: none; display: block; }
    .brand-container h1 { font-size: 28px; font-weight: bold; }
    
    nav { background: #212529; display: flex; justify-content: center; overflow-x: auto; padding: 0 10px; }
    nav a { color: #fff; padding: 12px 16px; text-decoration: none; font-size: 15px; white-space: nowrap; transition: 0.2s; }
    nav a:hover { background: var(--primary); }

    .article-container { max-width: 800px; margin: 30px auto; background: #fff; padding: 40px; border: 1px solid var(--border); border-radius: 8px; }
    .article-category { font-size: 14px; color: var(--primary); font-weight: bold; text-transform: uppercase; margin-bottom: 10px; }
    .article-title { font-size: 32px; font-weight: bold; color: #111; margin-bottom: 15px; line-height: 1.3; }
    .article-meta { font-size: 14px; color: #666; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    
    .article-img-container { margin-bottom: 25px; text-align: center; }
    .article-img { width: 100%; max-height: 450px; object-fit: cover; border-radius: 6px; }
    
    .article-content { font-size: 18px; color: #333; margin-bottom: 40px; white-space: pre-line; }
    
    .back-btn { display: inline-block; padding: 10px 20px; background: var(--bg-dark); color: #fff; text-decoration: none; border-radius: 4px; font-weight: bold; transition: 0.2s; }
    .back-btn:hover { background: var(--primary); }

    footer { background: var(--bg-dark); color: #fff; text-align: center; padding: 30px 0; margin-top: 40px; font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <span>रावत समाचार डिजिटल न्यूज़</span>
      <span>सत्य और निष्पक्षता</span>
    </div>
    <a href="index.html" class="brand-container">
      <h1>रावत समाचार</h1>
    </a>
    <nav>
      <a href="index.html">होम</a>
      <a href="category.html?cat=uttarakhand">उत्तराखंड</a>
      <a href="category.html?cat=india">भारत</a>
      <a href="category.html?cat=world">दुनिया</a>
      <a href="category.html?cat=politics">राजनीति</a>
      <a href="category.html?cat=crime">अपराध</a>
      <a href="category.html?cat=education">शिक्षा</a>
      <a href="category.html?cat=tech">तकनीक</a>
      <a href="category.html?cat=sports">खेल</a>
      <a href="category.html?cat=entertainment">मनोरंजन</a>
      <a href="category.html?cat=auto">ऑटो</a>
      <a href="category.html?cat=religion">धर्म</a>
      <a href="category.html?cat=lifestyle">लाइफस्टाइल</a>
      <a href="category.html?cat=sarkari-yojana">सरकारी योजनाएँ</a>
    </nav>
  </header>

  <div class="article-container" id="article-box">
    <p style="text-align: center; color: #666;">खबर लोड हो रही है...</p>
  </div>

  <footer>
    <p>&copy; 2026 रावत समाचार. सर्वाधिकार सुरक्षित। GitHub Pages पर लाइव।</p>
  </footer>

  <script>
    async function loadArticleDetail() {
      const urlParams = new URLSearchParams(window.location.search);
      const articleSlug = urlParams.get('slug');

      const articleBox = document.getElementById('article-box');

      if (!articleSlug) {
        articleBox.innerHTML = '<h2 style="color: red;">त्रुटि: कोई खबर नहीं चुनी गई।</h2><br><a href="index.html" class="back-btn">होम पेज पर जाएं</a>';
        return;
      }

      try {
        const response = await fetch('data/articles.json');
        if (!response.ok) throw new Error('Articles data not found');
        const articles = await response.json();

        const article = articles.find(a => a.slug === articleSlug);

        if (!article) {
          articleBox.innerHTML = '<h2 style="color: red;">त्रुटि: यह खबर नहीं मिली या हटा दी गई है।</h2><br><a href="index.html" class="back-btn">होम पेज पर जाएं</a>';
          return;
        }

        // Update Page Title and SEO Meta
        document.getElementById('page-title').innerText = `${article.title} - रावत समाचार`;
        document.getElementById('meta-desc').setAttribute('content', article.description);

        // Render Article Content
        articleBox.innerHTML = `
          <div class="article-category">${article.category}</div>
          <h1 class="article-title">${article.title}</h1>
          <div class="article-meta">
            <span>लेखक: <strong>${article.author}</strong></span>
            <span>प्रकाशित: ${new Date(article.date).toLocaleDateString('hi-IN')} | पढ़ने का समय: ${article.readingTime || '3 min read'}</span>
          </div>
          <div class="article-img-container">
            <img src="${article.image}" alt="${article.title}" class="article-img" onerror="this.src='https://via.placeholder.com/800x450?text=Rawat+Samachar'">
          </div>
          <div class="article-content">${article.content}</div>
          <a href="index.html" class="back-btn">&#8592; वापस होम पेज पर जाएं</a>
        `;

      } catch (error) {
        console.error('Error loading article:', error);
        articleBox.innerHTML = '<h2 style="color: red;">खबर लोड करने में तकनीकी त्रुटि हुई है।</h2>';
      }
    }

    loadArticleDetail();
  </script>
</body>
</html>
